name: registry

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry:
    uses: bayinfosys/marigold/.github/workflows/registry.yml@v0.8.1
    with:
      marigold-version: "0.8.1"
      deploy: ${{ github.ref == 'refs/heads/master' }}
