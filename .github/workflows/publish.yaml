name: registry

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "bayis-marigold==0.8.0"
      - name: Build registry
        run: >
          marigold registry build .
          --out dist
          --front-page README.md
      - name: Build catalogue
        run: >
          docker run --rm --user "$(id -u):$(id -g)"
          -e HOME=/tmp -e GEM_HOME=/tmp/gems -e JEKYLL_ENV=production
          -v "$PWD/dist":/site -w /site ruby:3.3
          sh -c 'gem install jekyll -v "~> 4.3" --no-document
          && gem install kramdown-parser-gfm --no-document
          && /tmp/gems/bin/jekyll build'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
