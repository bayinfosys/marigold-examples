# Single self-contained catalogue for this example. Nothing else is
# assumed to be loaded alongside it.
#
# All names lowercase -- required, not just tidy: the submission path
# (receiver_logic.py) always lowercases the incoming model name before
# a case-sensitive DB lookup, so any mixed-case entry here is otherwise
# unreachable regardless of what the client sends.

_templates:

  slm: &slm
    provider: huggingface
    type: instruct
    input: chat
    output: chat
    # No extra_env -- everything under this template is <=151M params,
    # quantising buys nothing at this size.

  mainline: &mainline
    provider: huggingface
    type: instruct
    input: chat
    output: chat
    extra_env:
      LOAD_IN_4BIT: "1"

models:

  # --- Qwen3, full dense ladder up to the 14B cap ---

  - { <<: *mainline, name: qwen/qwen3-0.6b }
  - { <<: *mainline, name: qwen/qwen3-1.7b }
  - { <<: *mainline, name: qwen/qwen3-4b }
  - { <<: *mainline, name: qwen/qwen3-8b }
  - { <<: *mainline, name: qwen/qwen3-14b }

  # --- Gemma, both current generations, up to 12B ---

  - { <<: *mainline, name: google/gemma-3-1b-it }
  - { <<: *mainline, name: google/gemma-3-4b-it }
  - { <<: *mainline, name: google/gemma-3-12b-it }
  - { <<: *mainline, name: google/gemma-4-e2b-it }
  - { <<: *mainline, name: google/gemma-4-e4b-it }
  - { <<: *mainline, name: google/gemma-4-12b-it }

  # --- Llama family, capped at 8B -- no mainline dense Llama exists
  # between 8B and 70B, and Llama 4 moved to MoE

  - { <<: *mainline, name: meta-llama/llama-3.2-1b-instruct }
  - { <<: *mainline, name: meta-llama/llama-3.2-3b-instruct }
  - { <<: *mainline, name: meta-llama/llama-3.1-8b-instruct }
  - { <<: *mainline, name: cognitivecomputations/dolphin-2.9-llama3-8b }

  # -- https://huggingface.co/spaces/AxiomicLabs/Open_SLM_Leaderboard --- 
  # everything with trust remote code, gated, and large sized MoE

  - { <<: *slm, name: huggingfacetb/smollm2-135m }
