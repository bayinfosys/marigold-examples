# examples/simple-rag/marigold.toml -- package, overrides only what it needs to
[application]
name = "simple-rag"
version = "0.1.0"
description = "Question answering over your own documents, with a test that proves retrieval is happening."
models_yaml = ["models.yaml"]

[environment]
RAG_EMBEDDING_MODEL = "sentence-transformers/all-minilm-l6-v2"
